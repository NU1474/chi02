<!DOCTYPE html>
<html lang="ja" class="dark font-size-base layout-density-normal">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>BESS Chinese Lab | 蓄電池・EMS・LIB 技術者向け中国語会話学習アプリ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            500: '#14b8a6',
                            600: '#0d9488',
                            700: '#0f766e',
                            800: '#115e59',
                            900: '#134e4a',
                            dark: '#0f172a',
                            card: '#1e293b'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans SC', system-ui, -apple-system, sans-serif;
        }

        /* Dynamic Font Size Control Classes */
        html.font-size-sm { font-size: 14px; }
        html.font-size-base { font-size: 16px; }
        html.font-size-lg { font-size: 18px; }

        /* Dynamic Layout Density Control Classes */
        html.layout-density-spacious .card-padding { padding: 1.5rem; }
        html.layout-density-spacious .card-gap { gap: 1.25rem; }
        
        html.layout-density-normal .card-padding { padding: 1.125rem; }
        html.layout-density-normal .card-gap { gap: 1rem; }

        html.layout-density-compact .card-padding { padding: 0.75rem; }
        html.layout-density-compact .card-gap { gap: 0.625rem; }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(20, 184, 166, 0.3);
            border-radius: 3px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(20, 184, 166, 0.6);
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen flex flex-col antialiased selection:bg-teal-500 selection:text-white transition-colors duration-200">

    <!-- Header / Navbar -->
    <header class="border-b border-slate-200 dark:border-slate-800 bg-white/90 dark:bg-slate-900/80 backdrop-blur sticky top-0 z-50 transition-colors">
        <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16 gap-2">
                <!-- Logo & Title -->
                <div class="flex items-center gap-2.5 min-w-0">
                    <div class="w-9 h-9 sm:w-10 sm:h-10 shrink-0 rounded-xl bg-gradient-to-tr from-teal-500 to-emerald-400 flex items-center justify-center text-slate-950 font-bold text-lg sm:text-xl shadow-md shadow-teal-500/20">
                        <i class="fa-solid fa-bolt-lightning"></i>
                    </div>
                    <div class="min-w-0">
                        <h1 class="text-base sm:text-lg font-bold tracking-tight text-slate-900 dark:text-white flex items-center gap-1.5 truncate">
                            <span class="truncate">BESS Chinese Lab</span>
                            <span class="hidden sm:inline-block text-[10px] px-1.5 py-0.5 rounded bg-teal-500/10 text-teal-600 dark:text-teal-400 border border-teal-500/20 font-normal shrink-0">v1.2</span>
                        </h1>
                        <p class="text-[11px] sm:text-xs text-slate-500 dark:text-slate-400 truncate">蓄電池・EMS・LIB技術者向け会話学習</p>
                    </div>
                </div>

                <!-- Global Controls -->
                <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
                    <!-- Quick Font Size Button -->
                    <button onclick="cycleFontSize()" class="px-2 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-xs font-bold text-slate-700 dark:text-slate-300 transition flex items-center gap-1" title="文字サイズ変更">
                        <i class="fa-solid fa-text-height text-teal-500"></i>
                        <span id="fontSizeQuickBadge" class="text-[11px] font-mono">標準</span>
                    </button>

                    <!-- Favorites Filter Toggle -->
                    <button id="favFilterBtn" onclick="toggleFavFilter()" class="px-2.5 sm:px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-xs font-medium text-slate-700 dark:text-slate-300 flex items-center gap-1.5 whitespace-nowrap transition">
                        <i class="fa-solid fa-star text-amber-400 text-sm"></i>
                        <span id="favFilterText" class="hidden sm:inline">お気に入り</span>
                        <span id="favCountBadge" class="bg-amber-500/20 text-amber-600 dark:text-amber-300 text-[10px] px-1.5 py-0.5 rounded-full font-bold">0</span>
                    </button>

                    <!-- Theme Toggle Button -->
                    <button id="themeToggleBtn" onclick="toggleTheme()" class="p-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 transition" title="テーマ切り替え">
                        <i id="themeIcon" class="fa-solid fa-sun text-amber-400"></i>
                    </button>

                    <!-- Settings Modal Toggle -->
                    <button onclick="toggleSettingsModal()" class="p-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 transition" title="表示・音声設定">
                        <i class="fa-solid fa-gear"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-6 lg:px-8 py-4 sm:py-6 flex flex-col gap-4 sm:gap-6">

        <!-- Top Navigation: Category Selector (1 col on mobile, 3 col on lg) -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-2.5 sm:gap-3 card-gap">
            <button onclick="switchCategory('A')" id="catBtnA" class="cat-btn relative overflow-hidden rounded-xl border border-teal-500/50 bg-white dark:bg-slate-900 p-3.5 sm:p-4 text-left transition hover:border-teal-500 group shadow-sm dark:shadow-none active-cat">
                <div class="flex items-center justify-between mb-1">
                    <span class="text-[11px] sm:text-xs font-semibold uppercase tracking-wider text-teal-600 dark:text-teal-400">Category A</span>
                    <i class="fa-solid fa-charging-station text-teal-500 text-base sm:text-lg"></i>
                </div>
                <div class="text-sm sm:text-base font-bold text-slate-900 dark:text-white mb-0.5">系統用蓄電池・BESS</div>
                <div class="text-[11px] sm:text-xs text-slate-500 dark:text-slate-400 truncate">系统级储能 / 储能电站 / PCS / 仕様書</div>
            </button>

            <button onclick="switchCategory('B')" id="catBtnB" class="cat-btn relative overflow-hidden rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-3.5 sm:p-4 text-left transition hover:border-teal-500/50 group shadow-sm dark:shadow-none">
                <div class="flex items-center justify-between mb-1">
                    <span class="text-[11px] sm:text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 group-hover:text-teal-500">Category B</span>
                    <i class="fa-solid fa-microchip text-slate-400 dark:text-slate-500 text-base sm:text-lg group-hover:text-teal-500 transition"></i>
                </div>
                <div class="text-sm sm:text-base font-bold text-slate-900 dark:text-white mb-0.5">EMS・制御・電力</div>
                <div class="text-[11px] sm:text-xs text-slate-500 dark:text-slate-400 truncate">能源管理系统 / BMS / 通信プロトコル</div>
            </button>

            <button onclick="switchCategory('C')" id="catBtnC" class="cat-btn relative overflow-hidden rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-3.5 sm:p-4 text-left transition hover:border-teal-500/50 group shadow-sm dark:shadow-none">
                <div class="flex items-center justify-between mb-1">
                    <span class="text-[11px] sm:text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 group-hover:text-teal-500">Category C</span>
                    <i class="fa-solid fa-car-battery text-slate-400 dark:text-slate-500 text-base sm:text-lg group-hover:text-teal-500 transition"></i>
                </div>
                <div class="text-sm sm:text-base font-bold text-slate-900 dark:text-white mb-0.5">LIB・セル開発</div>
                <div class="text-[11px] sm:text-xs text-slate-500 dark:text-slate-400 truncate">锂离子电池 / LFP / 電極材料 / プロセス</div>
            </button>
        </div>

        <!-- Mode & Control Bar -->
        <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 bg-white/80 dark:bg-slate-900/60 p-2.5 sm:p-3 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm dark:shadow-none">
            <!-- Mode Switcher Tabs -->
            <div class="flex overflow-x-auto custom-scrollbar bg-slate-100 dark:bg-slate-950 p-1 rounded-xl border border-slate-200 dark:border-slate-800/80 gap-1 shrink-0">
                <button onclick="switchMode('vocab')" id="modeBtnVocab" class="flex-1 min-w-[100px] sm:flex-initial px-3 sm:px-4 py-2 rounded-lg text-xs transition flex items-center justify-center gap-1.5 whitespace-nowrap bg-teal-500 text-slate-950 font-bold shadow">
                    <i class="fa-solid fa-book-bookmark"></i>
                    <span>単語・発音</span>
                </button>
                <button onclick="switchMode('listening')" id="modeBtnListening" class="flex-1 min-w-[110px] sm:flex-initial px-3 sm:px-4 py-2 rounded-lg text-xs transition flex items-center justify-center gap-1.5 whitespace-nowrap text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200">
                    <i class="fa-solid fa-headphones"></i>
                    <span>リスニング・Flash</span>
                </button>
                <button onclick="switchMode('dialogue')" id="modeBtnDialogue" class="flex-1 min-w-[110px] sm:flex-initial px-3 sm:px-4 py-2 rounded-lg text-xs transition flex items-center justify-center gap-1.5 whitespace-nowrap text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200">
                    <i class="fa-solid fa-comments"></i>
                    <span>技術会話演習</span>
                </button>
            </div>

            <!-- Search & Filters (Vocab Mode Only) -->
            <div id="searchBarContainer" class="relative flex-1 w-full sm:max-w-xs">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500 text-xs"></i>
                <input type="text" id="searchInput" oninput="handleSearch()" placeholder="検索 (漢字, ピンイン, 日本語)..." class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl pl-9 pr-8 py-2 text-xs text-slate-900 dark:text-slate-200 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:border-teal-500 transition">
                <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500 hover:text-slate-600 dark:hover:text-slate-300 text-xs">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
        </div>

        <!-- MODE 1: VOCABULARY & PRONUNCIATION -->
        <section id="vocabModeView" class="space-y-4">
            <!-- Stats / Status Banner -->
            <div class="flex items-center justify-between px-1 text-xs text-slate-500 dark:text-slate-400">
                <div>
                    表示中: <span id="vocabCountText" class="text-teal-600 dark:text-teal-400 font-bold">0</span> 件の技術用語
                </div>
                <div class="flex items-center gap-3">
                    <span class="flex items-center gap-1"><i class="fa-solid fa-microphone text-teal-500"></i> 音声認識対応</span>
                </div>
            </div>

            <!-- Cards Grid (Mobile/Tall Phones: Always 1 column for high readability; md+: 2 columns; xl+: 3 columns) -->
            <div id="vocabGrid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 card-gap">
                <!-- Dynamic Content Injection -->
            </div>
        </section>

        <!-- MODE 2: LISTENING & FLASHCARDS -->
        <section id="listeningModeView" class="hidden flex-1 flex flex-col items-center justify-center min-h-[420px]">
            <div class="w-full max-w-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 sm:p-6 shadow-xl dark:shadow-2xl relative flex flex-col items-center text-center">
                
                <!-- Progress & Score Header -->
                <div class="w-full flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-3.5 mb-5 text-xs text-slate-500 dark:text-slate-400">
                    <span id="fcCardIndex" class="font-mono text-teal-600 dark:text-teal-400 font-bold">1 / 10</span>
                    <div class="flex gap-2">
                        <button onclick="toggleAutoPlay()" id="autoPlayBtn" class="px-2.5 py-1 rounded border border-slate-200 dark:border-slate-700 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 transition flex items-center gap-1">
                            <i class="fa-solid fa-circle-play text-teal-500"></i>
                            <span id="autoPlayText">自動再生: OFF</span>
                        </button>
                    </div>
                </div>

                <!-- Flashcard Content Area -->
                <div class="w-full min-h-[200px] flex flex-col items-center justify-center relative my-2 px-2 sm:px-4">
                    
                    <!-- Sound Play Large Button -->
                    <button onclick="playCurrentFlashcardAudio()" class="w-14 h-14 sm:w-16 sm:h-16 rounded-full bg-teal-500/10 border border-teal-500/30 text-teal-600 dark:text-teal-400 hover:bg-teal-500 hover:text-white dark:hover:text-slate-950 transition flex items-center justify-center mb-5 group shadow-lg shadow-teal-500/10">
                        <i class="fa-solid fa-volume-high text-xl sm:text-2xl group-hover:scale-110 transition-transform"></i>
                    </button>

                    <!-- Hanzi Display -->
                    <div id="fcHanzi" class="text-3xl sm:text-4xl font-bold text-slate-900 dark:text-white mb-2 tracking-wide font-chinese">
                        ---
                    </div>

                    <!-- Pinyin Display -->
                    <div id="fcPinyin" class="text-sm sm:text-base text-teal-600 dark:text-teal-400 font-semibold mb-4">
                        ---
                    </div>

                    <!-- Meaning Display -->
                    <div id="fcMeaning" class="text-xs sm:text-sm text-slate-800 dark:text-slate-300 bg-slate-100 dark:bg-slate-950/80 px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800/80 min-w-[200px] transition-all">
                        ---
                    </div>

                    <!-- Example Sentence -->
                    <div id="fcExample" class="mt-4 text-xs text-slate-500 dark:text-slate-400 bg-slate-50 dark:bg-slate-950/40 p-3 rounded-lg border border-slate-200 dark:border-slate-800/50 w-full text-left hidden">
                        <div class="text-slate-800 dark:text-slate-300 font-sans not-italic mb-0.5" id="fcExZh"></div>
                        <div class="text-slate-500 dark:text-slate-500" id="fcExJa"></div>
                    </div>
                </div>

                <!-- Card Actions / Controls -->
                <div class="w-full pt-5 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between gap-2 sm:gap-3">
                    <button onclick="prevFlashcard()" class="flex-1 py-2 sm:py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-semibold transition flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-arrow-left"></i> 前へ
                    </button>
                    <button onclick="toggleMeaningReveal()" id="revealBtn" class="flex-1 py-2 sm:py-2.5 rounded-xl border border-teal-500/30 bg-teal-500/10 hover:bg-teal-500/20 text-teal-700 dark:text-teal-300 text-xs font-semibold transition">
                        意味表示
                    </button>
                    <button onclick="nextFlashcard()" class="flex-1 py-2 sm:py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-semibold transition flex items-center justify-center gap-1.5">
                        次へ <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>

            </div>
        </section>

        <!-- MODE 3: TECHNICAL DIALOGUE SIMULATION -->
        <section id="dialogueModeView" class="hidden flex-1 flex flex-col space-y-4">
            <!-- Dialogue Topic Switcher -->
            <div id="dialogueList" class="flex gap-2 overflow-x-auto pb-1 custom-scrollbar">
                <!-- Dynamic Dialogue Tabs Injection -->
            </div>

            <!-- Dialogue Main Chat Interface -->
            <div class="flex-1 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl flex flex-col overflow-hidden shadow-lg dark:shadow-xl min-h-[480px]">
                
                <!-- Dialogue Info Header -->
                <div class="p-3.5 sm:p-4 bg-slate-50 dark:bg-slate-950/60 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between gap-2">
                    <div>
                        <h2 id="dialogueTitle" class="text-xs sm:text-sm font-bold text-slate-900 dark:text-white flex items-center gap-2">
                            ---
                        </h2>
                        <p id="dialogueDesc" class="text-[11px] sm:text-xs text-slate-500 dark:text-slate-400 mt-0.5">---</p>
                    </div>
                    <button onclick="playAllDialogue()" class="px-2.5 sm:px-3 py-1.5 rounded-lg bg-teal-500 text-slate-950 font-bold text-xs hover:bg-teal-400 transition flex items-center gap-1.5 shrink-0 shadow-md shadow-teal-500/20">
                        <i class="fa-solid fa-play"></i> <span class="hidden sm:inline">全体通し</span>再生
                    </button>
                </div>

                <!-- Chat Scroll Area -->
                <div id="chatContainer" class="flex-1 p-3.5 sm:p-4 overflow-y-auto space-y-4 custom-scrollbar">
                    <!-- Dynamic Messages Injection -->
                </div>

                <!-- Speaking Practice Footer -->
                <div class="p-3 sm:p-4 bg-slate-50 dark:bg-slate-950/80 border-t border-slate-200 dark:border-slate-800 flex flex-col sm:flex-row items-center gap-2">
                    <div class="text-[11px] sm:text-xs text-slate-500 dark:text-slate-400 flex-1">
                        <span class="text-teal-600 dark:text-teal-400 font-bold"><i class="fa-solid fa-lightbulb"></i> ヒント:</span> 各発言のアイコンから単音再生・マイク音読評価ができます。
                    </div>
                </div>

            </div>
        </section>

    </main>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl max-w-md w-full p-5 sm:p-6 shadow-2xl relative text-slate-900 dark:text-slate-100 max-h-[90vh] overflow-y-auto custom-scrollbar">
            <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-3 mb-4">
                <h3 class="text-sm sm:text-base font-bold flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-teal-500"></i> アプリ表示・音声設定
                </h3>
                <button onclick="toggleSettingsModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div class="space-y-5 text-xs">
                
                <!-- Display Setting: Font Size -->
                <div>
                    <label class="text-slate-700 dark:text-slate-300 font-bold block mb-2">文字サイズ (Font Size)</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="setFontSize('sm')" id="fontSizeBtn_sm" class="py-2 px-3 rounded-xl border border-slate-200 dark:border-slate-800 text-center font-medium transition">
                            小 (Small)
                        </button>
                        <button onclick="setFontSize('base')" id="fontSizeBtn_base" class="py-2 px-3 rounded-xl border border-slate-200 dark:border-slate-800 text-center font-medium transition">
                            標準 (Normal)
                        </button>
                        <button onclick="setFontSize('lg')" id="fontSizeBtn_lg" class="py-2 px-3 rounded-xl border border-slate-200 dark:border-slate-800 text-center font-medium transition">
                            大 (Large)
                        </button>
                    </div>
                </div>

                <!-- Display Setting: Layout Density (Balance) -->
                <div>
                    <label class="text-slate-700 dark:text-slate-300 font-bold block mb-2">レイアウト密度 (全体の余白バランス)</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="setLayoutDensity('compact')" id="densityBtn_compact" class="py-2 px-2 rounded-xl border border-slate-200 dark:border-slate-800 text-center font-medium transition">
                            コンパクト
                        </button>
                        <button onclick="setLayoutDensity('normal')" id="densityBtn_normal" class="py-2 px-2 rounded-xl border border-slate-200 dark:border-slate-800 text-center font-medium transition">
                            標準
                        </button>
                        <button onclick="setLayoutDensity('spacious')" id="densityBtn_spacious" class="py-2 px-2 rounded-xl border border-slate-200 dark:border-slate-800 text-center font-medium transition">
                            ゆったり
                        </button>
                    </div>
                </div>

                <!-- Speech Rate Slider -->
                <div class="pt-3 border-t border-slate-200 dark:border-slate-800">
                    <div class="flex justify-between mb-1">
                        <label class="text-slate-700 dark:text-slate-300 font-bold">再生速度 (Rate)</label>
                        <span id="rateVal" class="text-teal-600 dark:text-teal-400 font-mono font-bold">0.9x</span>
                    </div>
                    <input type="range" id="speechRate" min="0.5" max="1.3" step="0.1" value="0.9" oninput="updateSpeechRate(this.value)" class="w-full accent-teal-500 bg-slate-200 dark:bg-slate-800 rounded-lg">
                </div>

                <!-- Voice Selection CHN -->
                <div>
                    <label class="block text-slate-700 dark:text-slate-300 font-bold mb-1">中国語 TTS 音声モデル</label>
                    <select id="zhVoiceSelect" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl px-3 py-2 text-slate-800 dark:text-slate-300 focus:outline-none focus:border-teal-500">

                        { speaker: "中国側メーカー", role: "CN", zh: "我们采用高精度的恒流高温化成工艺，并配合在线气体检测，确保 SEI 膜均匀致密。", py: "Wǒ men cǎi yòng gāo jīng dù de héng liú gāo wēn huà chéng gōng yì, bìng pèi hé zài xiàn qì tǐ jiǎn cè, què bǎo SEI mó jūn yún zhì mì.", ja: "弊社では高精度の定電流高温化成プロセスを採用し、インラインガス検知と組み合わせてSEI被膜が均一かつ緻密になるよう確保しています。" },

        // ==========================================
        // 2. APP STATE MANAGEMENT
        // ==========================================
        let state = {
            currentCategory: 'A', // 'A', 'B', 'C'
            currentMode: 'vocab', // 'vocab', 'listening', 'dialogue'
            searchQuery: '',
            favorites: JSON.parse(localStorage.getItem('bess_favs') || '[]'),
            onlyFavs: false,
            theme: localStorage.getItem('bess_theme') || 'dark', // 'dark' or 'light'
            
            // Display & Balance Settings
            fontSize: localStorage.getItem('bess_font_size') || 'base', // 'sm', 'base', 'lg'
            layoutDensity: localStorage.getItem('bess_density') || 'normal', // 'compact', 'normal', 'spacious'

            // Flashcard state
            fcIndex: 0,
            fcRevealed: false,
            autoPlay: false,
            autoPlayTimer: null,

            // Dialogue state
            currentDialogueKey: 'A',

            // Audio settings
            speechRate: 0.9,
            autoReadJa: false,
            selectedZhVoice: '',
            selectedJaVoice: ''
        };

        // Speech Synthesis & Recognition Refs
        const synth = window.speechSynthesis;
        let recognition = null;

        // Init Web Speech Recognition if available
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'zh-CN';
        }

        // ==========================================
        // 3. INITIALIZATION & DISPLAY SETTINGS
        // ==========================================
        window.onload = function() {
            initTheme();
            applyFontSizeUI();
            applyLayoutDensityUI();
            populateVoiceList();
            if (synth.onvoiceschanged !== undefined) {
                synth.onvoiceschanged = populateVoiceList;
            }
            updateFavBadge();
            renderView();
        };

        function initTheme() {
            if (state.theme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
            updateThemeIcon();
        }

        function toggleTheme() {
            state.theme = (state.theme === 'dark') ? 'light' : 'dark';
            localStorage.setItem('bess_theme', state.theme);
            initTheme();
        }

        function updateThemeIcon() {
            const icon = document.getElementById('themeIcon');
            if (state.theme === 'dark') {
                icon.className = "fa-solid fa-sun text-amber-400";
            } else {
                icon.className = "fa-solid fa-moon text-slate-700";
            }
        }

        // Font Size Adjustments
        function setFontSize(sizeKey) {
            state.fontSize = sizeKey;
            localStorage.setItem('bess_font_size', sizeKey);
            applyFontSizeUI();
        }

        function cycleFontSize() {
            const sizes = ['sm', 'base', 'lg'];
            const nextIdx = (sizes.indexOf(state.fontSize) + 1) % sizes.length;
            setFontSize(sizes[nextIdx]);
        }

        function applyFontSizeUI() {
            const html = document.documentElement;
            html.classList.remove('font-size-sm', 'font-size-base', 'font-size-lg');
            html.classList.add(`font-size-${state.fontSize}`);

            const badge = document.getElementById('fontSizeQuickBadge');
            const labels = { sm: '小', base: '標準', lg: '大' };
            if (badge) badge.textContent = labels[state.fontSize] || '標準';

            // Modal Buttons UI
            ['sm', 'base', 'lg'].forEach(k => {
                const btn = document.getElementById(`fontSizeBtn_${k}`);
                if (btn) {
                    if (k === state.fontSize) {
                        btn.className = "py-2 px-3 rounded-xl border border-teal-500 bg-teal-500/20 text-teal-600 dark:text-teal-300 font-bold transition";
                    } else {
                        btn.className = "py-2 px-3 rounded-xl border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-400 hover:border-slate-400 font-medium transition";
                    }
                }
            });
        }

        // Layout Density Adjustments
        function setLayoutDensity(densityKey) {
            state.layoutDensity = densityKey;
            localStorage.setItem('bess_density', densityKey);
            applyLayoutDensityUI();
        }

        function applyLayoutDensityUI() {
            const html = document.documentElement;
            html.classList.remove('layout-density-compact', 'layout-density-normal', 'layout-density-spacious');
            html.classList.add(`layout-density-${state.layoutDensity}`);

            // Modal Buttons UI
            ['compact', 'normal', 'spacious'].forEach(k => {
                const btn = document.getElementById(`densityBtn_${k}`);
                if (btn) {
                    if (k === state.layoutDensity) {
                        btn.className = "py-2 px-2 rounded-xl border border-teal-500 bg-teal-500/20 text-teal-600 dark:text-teal-300 font-bold transition";
                    } else {
                        btn.className = "py-2 px-2 rounded-xl border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-400 hover:border-slate-400 font-medium transition";
                    }
                }
            });
        }

        function populateVoiceList() {
            const voices = synth.getVoices();
            const zhSelect = document.getElementById('zhVoiceSelect');
            const jaSelect = document.getElementById('jaVoiceSelect');

            zhSelect.innerHTML = '<option value="">自動検出 (Default Mandarin)</option>';
            jaSelect.innerHTML = '<option value="">自動検出 (Default Japanese)</option>';

            voices.forEach(voice => {
                const option = document.createElement('option');
                option.value = voice.name;
                option.textContent = `${voice.name} (${voice.lang})`;

                if (voice.lang.includes('zh') || voice.lang.includes('cmn')) {
                    zhSelect.appendChild(option);
                } else if (voice.lang.includes('ja')) {
                    jaSelect.appendChild(option.cloneNode(true));
                }
            });
        }

        // ==========================================
        // 4. VIEW RENDERING PIPELINE
        // ==========================================
        function renderView() {
            updateCategoryTabsUI();
            updateModeTabsUI();

            // Toggle Section Visibility
            document.getElementById('vocabModeView').classList.toggle('hidden', state.currentMode !== 'vocab');
            document.getElementById('listeningModeView').classList.toggle('hidden', state.currentMode !== 'listening');
            document.getElementById('dialogueModeView').classList.toggle('hidden', state.currentMode !== 'dialogue');
            document.getElementById('searchBarContainer').style.display = (state.currentMode === 'vocab') ? 'block' : 'none';

            if (state.currentMode === 'vocab') {
                renderVocabGrid();
            } else if (state.currentMode === 'listening') {
                initFlashcardMode();
            } else if (state.currentMode === 'dialogue') {
                renderDialogueMode();
            }
        }

        // ==========================================
        // 5. VOCABULARY MODE RENDERING & LOGIC
        // ==========================================
        function getFilteredVocab() {
            const list = DB.categories[state.currentCategory].vocab;
            return list.filter(item => {
                // Favorite filter
                if (state.onlyFavs && !state.favorites.includes(item.id)) return false;

                // Search query filter
                if (state.searchQuery.trim() !== '') {
                    const q = state.searchQuery.toLowerCase();
                    return item.hanzi.toLowerCase().includes(q) ||
                           item.pinyin.toLowerCase().includes(q) ||
                           item.ja.toLowerCase().includes(q) ||
                           item.note.toLowerCase().includes(q);
                }
                return true;
            });
        }

        function renderVocabGrid() {
            const container = document.getElementById('vocabGrid');
            const filtered = getFilteredVocab();
            document.getElementById('vocabCountText').textContent = filtered.length;

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full py-12 sm:py-16 text-center text-slate-500 dark:text-slate-500 bg-white dark:bg-slate-900/40 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
                        <i class="fa-solid fa-folder-open text-3xl sm:text-4xl mb-3 text-slate-400 dark:text-slate-600"></i>
                        <p class="text-xs sm:text-sm">条件に一致する専門用語が見つかりませんでした。</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(item => {
                const isFav = state.favorites.includes(item.id);
                return `
                    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:border-teal-500/50 dark:hover:border-teal-500/40 rounded-2xl card-padding flex flex-col justify-between transition-all duration-200 group relative shadow-sm dark:shadow-none">
                        <!-- Top Row: ID & Favorite -->
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-[10px] font-mono px-2 py-0.5 rounded bg-slate-100 dark:bg-slate-950 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-800 font-semibold">${item.id}</span>
                            <button onclick="toggleFavorite('${item.id}')" class="text-slate-400 hover:text-amber-400 transition p-1">
                                <i class="fa-${isFav ? 'solid' : 'regular'} fa-star ${isFav ? 'text-amber-400' : ''} text-base"></i>
                            </button>
                        </div>

                        <!-- Main Term: Hanzi & Pinyin -->
                        <div class="mb-3">
                            <div class="flex items-baseline justify-between gap-2 mb-1">
                                <h3 class="text-2xl sm:text-3xl font-bold text-slate-900 dark:text-white tracking-wide font-chinese leading-snug">${item.hanzi}</h3>
                                <button onclick="speakText('${item.hanzi}', 'zh-CN')" class="text-teal-600 dark:text-teal-400 hover:text-teal-500 dark:hover:text-teal-300 transition p-1 text-base shrink-0" title="音声再生">
                                    <i class="fa-solid fa-volume-high"></i>
                                </button>
                            </div>
                            <div class="text-xs sm:text-sm text-teal-600 dark:text-teal-400 font-semibold font-mono">${item.pinyin}</div>
                        </div>

                        <!-- Japanese Meaning & Technical Note -->
                        <div class="space-y-2 border-t border-slate-100 dark:border-slate-800/80 pt-3 mb-3">
                            <div class="text-sm sm:text-base font-bold text-slate-800 dark:text-slate-200 leading-snug">${item.ja}</div>
                            <div class="text-xs text-slate-600 dark:text-slate-400 bg-slate-50 dark:bg-slate-950/60 p-2.5 rounded-xl border border-slate-200/60 dark:border-slate-800/50 leading-relaxed">
                                <i class="fa-solid fa-circle-info text-teal-500 mr-1"></i> ${item.note}
                            </div>
                        </div>

                        <!-- Example Sentence Preview -->
                        <div class="bg-slate-50 dark:bg-slate-950/40 p-2.5 rounded-xl border border-slate-200/60 dark:border-slate-800/40 text-xs mb-3">
                            <div class="text-slate-800 dark:text-slate-300 font-chinese mb-1 flex items-start justify-between gap-2">
                                <span class="text-xs sm:text-sm leading-snug">${item.exZh}</span>
                                <button onclick="speakText('${item.exZh.replace(/'/g, "\\'")}', 'zh-CN')" class="text-slate-400 hover:text-teal-500 dark:hover:text-teal-400 transition text-xs shrink-0 pt-0.5">
                                    <i class="fa-solid fa-volume-low"></i>
                                </button>
                            </div>
                            <div class="text-slate-500 dark:text-slate-500 text-[11px] sm:text-xs leading-snug">${item.exJa}</div>
                        </div>

                        <!-- Bottom Actions: Speech Recognition Practice -->
                        <div class="pt-2 border-t border-slate-100 dark:border-slate-800/60 flex items-center justify-between gap-2">
                            <button onclick="startPronunciationPractice('${item.id}', '${item.hanzi}')" id="recBtn_${item.id}" class="flex-1 py-2 px-3 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-teal-500/10 hover:text-teal-600 dark:hover:text-teal-300 text-slate-700 dark:text-slate-300 text-xs font-medium border border-slate-200 dark:border-slate-700/80 transition flex items-center justify-center gap-2">
                                <i class="fa-solid fa-microphone text-teal-500"></i>
                                <span>発音練習</span>
                            </button>
                            <span id="score_${item.id}" class="text-[11px] font-mono text-slate-500 dark:text-slate-400 hidden"></span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ==========================================
        // 6. FLASHCARD & LISTENING MODE
        // ==========================================
        function initFlashcardMode() {
            state.fcIndex = 0;
            state.fcRevealed = false;
            renderFlashcard();
        }

        function renderFlashcard() {
            const filtered = getFilteredVocab();
            const total = filtered.length;

            if (total === 0) {
                document.getElementById('fcHanzi').textContent = "データなし";
                document.getElementById('fcPinyin').textContent = "";
                document.getElementById('fcMeaning').textContent = "お気に入りまたは検索条件を変更してください";
                document.getElementById('fcCardIndex').textContent = "0 / 0";
                return;
            }

            const item = filtered[state.fcIndex];
            document.getElementById('fcCardIndex').textContent = `${state.fcIndex + 1} / ${total}`;
            document.getElementById('fcHanzi').textContent = item.hanzi;
            document.getElementById('fcPinyin').textContent = item.pinyin;

            // Handle Reveal / Hide Meaning
            const meaningEl = document.getElementById('fcMeaning');
            const exEl = document.getElementById('fcExample');

            if (state.fcRevealed) {
                meaningEl.textContent = `${item.ja} (${item.note})`;
                meaningEl.classList.remove('opacity-0', 'blur-sm');
                document.getElementById('fcExZh').textContent = item.exZh;
                document.getElementById('fcExJa').textContent = item.exJa;
                exEl.classList.remove('hidden');
            } else {
                meaningEl.textContent = "??? (タップで表示)";
                meaningEl.classList.add('opacity-0', 'blur-sm');
                exEl.classList.add('hidden');
            }
        }

        function toggleMeaningReveal() {
            state.fcRevealed = !state.fcRevealed;
            renderFlashcard();
        }

        function nextFlashcard() {
            const filtered = getFilteredVocab();
            if (filtered.length === 0) return;
            state.fcIndex = (state.fcIndex + 1) % filtered.length;
            state.fcRevealed = false;
            renderFlashcard();
            if (state.autoPlay) playCurrentFlashcardAudio();
        }

        function prevFlashcard() {
            const filtered = getFilteredVocab();
            if (filtered.length === 0) return;
            state.fcIndex = (state.fcIndex - 1 + filtered.length) % filtered.length;
            state.fcRevealed = false;
            renderFlashcard();
            if (state.autoPlay) playCurrentFlashcardAudio();
        }

        function playCurrentFlashcardAudio() {
            const filtered = getFilteredVocab();
            if (filtered.length === 0) return;
            const item = filtered[state.fcIndex];
            speakText(item.hanzi, 'zh-CN', () => {
                if (state.autoReadJa) {
                    speakText(item.ja, 'ja-JP');
                }
            });
        }

        function toggleAutoPlay() {
            state.autoPlay = !state.autoPlay;
            const btn = document.getElementById('autoPlayBtn');
            const txt = document.getElementById('autoPlayText');
            if (state.autoPlay) {
                btn.classList.add('bg-teal-500/20', 'border-teal-500');
                txt.textContent = '自動再生: ON';
                playCurrentFlashcardAudio();
            } else {
                btn.classList.remove('bg-teal-500/20', 'border-teal-500');
                txt.textContent = '自動再生: OFF';
            }
        }

        // ==========================================
        // 7. TECHNICAL DIALOGUE MODE
        // ==========================================
        function renderDialogueMode() {
            const dialogueTabsContainer = document.getElementById('dialogueList');
            dialogueTabsContainer.innerHTML = Object.keys(DB.dialogues).map(key => {
                const diag = DB.dialogues[key];
                const isActive = key === state.currentDialogueKey;
                return `
                    <button onclick="switchDialogue('${key}')" class="px-3.5 sm:px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition border ${isActive ? 'bg-teal-500/20 border-teal-500 text-teal-700 dark:text-teal-300' : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200'}">
                        ${key}. ${diag.title}
                    </button>
                `;
            }).join('');

            const activeDiag = DB.dialogues[state.currentDialogueKey];
            document.getElementById('dialogueTitle').innerHTML = `<i class="fa-solid fa-comments text-teal-500"></i> ${activeDiag.title}`;
            document.getElementById('dialogueDesc').textContent = activeDiag.desc;

            // Render Chat Messages
            const chatContainer = document.getElementById('chatContainer');
            chatContainer.innerHTML = activeDiag.messages.map((msg, idx) => {
                const isJP = msg.role === 'JP';
                return `
                    <div class="flex flex-col ${isJP ? 'items-end' : 'items-start'} mb-3">
                        <div class="flex items-center gap-2 mb-1 px-1">
                            <span class="text-[10px] font-bold ${isJP ? 'text-teal-600 dark:text-teal-400' : 'text-emerald-600 dark:text-emerald-400'}">${msg.speaker}</span>
                        </div>
                        <div class="max-w-[92%] sm:max-w-[80%] rounded-2xl p-3.5 sm:p-4 ${isJP ? 'bg-teal-500/10 dark:bg-teal-950/40 border border-teal-500/30 text-slate-900 dark:text-slate-100 rounded-tr-none' : 'bg-slate-100 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-slate-100 rounded-tl-none'} shadow-sm relative group">
                            
                            <!-- Hanzi -->
                            <div class="text-base sm:text-lg font-bold font-chinese mb-1 tracking-wide leading-snug">${msg.zh}</div>
                            
                            <!-- Pinyin -->
                            <div class="text-xs text-teal-600 dark:text-teal-400 font-mono mb-2">${msg.py}</div>
                            
                            <!-- Japanese Translation -->
                            <div class="text-xs text-slate-700 dark:text-slate-300 border-t border-slate-200 dark:border-slate-700/60 pt-2 font-sans leading-relaxed">${msg.ja}</div>

                            <!-- Actions Bar -->
                            <div class="mt-2.5 pt-2 border-t border-slate-200 dark:border-slate-800/60 flex items-center justify-end gap-3">
                                <button onclick="speakText('${msg.zh.replace(/'/g, "\\'")}', 'zh-CN')" class="text-slate-500 dark:text-slate-400 hover:text-teal-500 dark:hover:text-teal-400 transition text-xs flex items-center gap-1">
                                    <i class="fa-solid fa-volume-high"></i> 音声
                                </button>
                                <button onclick="startDialogueSpeechPractice(${idx}, '${msg.zh.replace(/'/g, "\\'")}')" id="diagRec_${idx}" class="text-slate-500 dark:text-slate-400 hover:text-teal-500 dark:hover:text-teal-400 transition text-xs flex items-center gap-1">
                                    <i class="fa-solid fa-microphone"></i> 音読練習
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function switchDialogue(key) {
            state.currentDialogueKey = key;
            renderDialogueMode();
        }

        function playAllDialogue() {
            const messages = DB.dialogues[state.currentDialogueKey].messages;
            let idx = 0;

            function playNext() {
                if (idx < messages.length) {
                    speakText(messages[idx].zh, 'zh-CN', () => {
                        idx++;
                        setTimeout(playNext, 600);
                    });
                }
            }
            playNext();
        }

        // ==========================================
        // 8. WEB SPEECH API (TTS & RECOGNITION)
        // ==========================================
        function speakText(text, lang, onEndCallback) {
            if (!synth) {
                showToast("お使いのブラウザは音声合成に対応していません。", "error");
                return;
            }

            synth.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = parseFloat(state.speechRate);
            utterance.lang = lang;

            const voices = synth.getVoices();
            if (lang.startsWith('zh') && state.selectedZhVoice) {
                const voice = voices.find(v => v.name === state.selectedZhVoice);
                if (voice) utterance.voice = voice;
            } else if (lang.startsWith('ja') && state.selectedJaVoice) {
                const voice = voices.find(v => v.name === state.selectedJaVoice);
                if (voice) utterance.voice = voice;
            }

            if (onEndCallback) {
                utterance.onend = onEndCallback;
            }

            synth.speak(utterance);
        }

        function startPronunciationPractice(itemId, targetHanzi) {
            if (!recognition) {
                showToast("お使いのブラウザは音声認識に対応していません。(Chrome/Edge推奨)", "error");
                return;
            }

            const btn = document.getElementById(`recBtn_${itemId}`);
            const scoreEl = document.getElementById(`score_${itemId}`);

            btn.classList.add('bg-rose-500/20', 'border-rose-500', 'text-rose-600', 'dark:text-rose-300', 'animate-pulse');
            btn.innerHTML = `<i class="fa-solid fa-microphone"></i> 発音中...`;

            recognition.start();

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                btn.classList.remove('bg-rose-500/20', 'border-rose-500', 'text-rose-600', 'dark:text-rose-300', 'animate-pulse');
                btn.innerHTML = `<i class="fa-solid fa-microphone text-teal-500"></i> 発音練習`;

                const score = calculateSimilarity(targetHanzi, transcript);
                scoreEl.classList.remove('hidden');
                
                if (score >= 80) {
                    scoreEl.className = "text-[11px] font-mono text-emerald-600 dark:text-emerald-400 font-bold";
                    scoreEl.textContent = `Perfect (${score}%) [認識: ${transcript}]`;
                    showToast(`評価: 合格 (${score}点) - "${transcript}"`, "success");
                } else if (score >= 50) {
                    scoreEl.className = "text-[11px] font-mono text-amber-600 dark:text-amber-400 font-bold";
                    scoreEl.textContent = `Good (${score}%) [認識: ${transcript}]`;
                    showToast(`評価: 惜しい (${score}点) - "${transcript}"`, "warning");
                } else {
                    scoreEl.className = "text-[11px] font-mono text-rose-600 dark:text-rose-400 font-bold";
                    scoreEl.textContent = `Try Again (${score}%) [認識: ${transcript}]`;
                    showToast(`評価: 再チャレンジ - "${transcript}"`, "error");
                }
            };

            recognition.onerror = () => {
                btn.classList.remove('bg-rose-500/20', 'border-rose-500', 'text-rose-600', 'dark:text-rose-300', 'animate-pulse');
                btn.innerHTML = `<i class="fa-solid fa-microphone text-teal-500"></i> 発音練習`;
                showToast("音声が聞き取れませんでした。もう一度お試しください。", "error");
            };
        }

        function startDialogueSpeechPractice(idx, targetZh) {
            if (!recognition) {
                showToast("お使いのブラウザは音声認識に対応していません。(Chrome/Edge推奨)", "error");
                return;
            }

            const btn = document.getElementById(`diagRec_${idx}`);
            const originalText = btn.innerHTML;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-rose-500"></i> 録音中...`;

            recognition.start();

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                btn.innerHTML = originalText;

                const score = calculateSimilarity(targetZh, transcript);
                showToast(`音読認識: "${transcript}" (一致度: ${score}%)`, score > 60 ? "success" : "warning");
            };

            recognition.onerror = () => {
                btn.innerHTML = originalText;
                showToast("音声聞き取りに失敗しました。", "error");
            };
        }

        function calculateSimilarity(str1, str2) {
            const clean1 = str1.replace(/[^\u4e00-\u9fa5]/g, '');
            const clean2 = str2.replace(/[^\u4e00-\u9fa5]/g, '');

            if (!clean1 || !clean2) return 0;

            let matches = 0;
            for (let char of clean2) {
                if (clean1.includes(char)) matches++;
            }
            return Math.min(100, Math.round((matches / clean1.length) * 100));
        }

        // ==========================================
        // 9. EVENT HANDLERS & CATEGORY SWITCHING
        // ==========================================
        function switchCategory(catKey) {
            state.currentCategory = catKey;
            state.fcIndex = 0;
            state.currentDialogueKey = catKey;
            renderView();
        }

        function switchMode(modeKey) {
            state.currentMode = modeKey;
            renderView();
        }

        function updateCategoryTabsUI() {
            ['A', 'B', 'C'].forEach(key => {
                const btn = document.getElementById(`catBtn${key}`);
                if (key === state.currentCategory) {
                    btn.className = "cat-btn relative overflow-hidden rounded-xl border border-teal-500 bg-white dark:bg-slate-900 p-3.5 sm:p-4 text-left transition shadow-md dark:shadow-none group active-cat";
                } else {
                    btn.className = "cat-btn relative overflow-hidden rounded-xl border border-slate-200 dark:border-slate-800 bg-white/70 dark:bg-slate-900/60 p-3.5 sm:p-4 text-left transition hover:border-slate-400 dark:hover:border-slate-700 group shadow-sm dark:shadow-none";
                }
            });
        }

        function updateModeTabsUI() {
            const modes = [
                { key: 'vocab', btnId: 'modeBtnVocab' },
                { key: 'listening', btnId: 'modeBtnListening' },
                { key: 'dialogue', btnId: 'modeBtnDialogue' }
            ];

            modes.forEach(m => {
                const btn = document.getElementById(m.btnId);
                if (m.key === state.currentMode) {
                    btn.className = "flex-1 min-w-[100px] sm:flex-initial px-3 sm:px-4 py-2 rounded-lg text-xs font-bold transition flex items-center justify-center gap-1.5 whitespace-nowrap bg-teal-500 text-slate-950 shadow";
                } else {
                    btn.className = "flex-1 min-w-[100px] sm:flex-initial px-3 sm:px-4 py-2 rounded-lg text-xs font-medium transition flex items-center justify-center gap-1.5 whitespace-nowrap text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200 hover:bg-slate-200/50 dark:hover:bg-slate-800/50";
                }
            });
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value;
            state.searchQuery = query;
            document.getElementById('clearSearchBtn').classList.toggle('hidden', query === '');
            renderVocabGrid();
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            state.searchQuery = '';
            document.getElementById('clearSearchBtn').classList.add('hidden');
            renderVocabGrid();
        }

        function toggleFavorite(itemId) {
            if (state.favorites.includes(itemId)) {
                state.favorites = state.favorites.filter(id => id !== itemId);
            } else {
                state.favorites.push(itemId);
            }
            localStorage.setItem('bess_favs', JSON.stringify(state.favorites));
            updateFavBadge();
            renderView();
        }

        function toggleFavFilter() {
            state.onlyFavs = !state.onlyFavs;
            const btn = document.getElementById('favFilterBtn');
            btn.classList.toggle('bg-amber-500/20', state.onlyFavs);
            btn.classList.toggle('border-amber-500/50', state.onlyFavs);
            renderView();
        }

        function updateFavBadge() {
            document.getElementById('favCountBadge').textContent = state.favorites.length;
        }

        function toggleSettingsModal() {
            const modal = document.getElementById('settingsModal');
            modal.classList.toggle('hidden');
        }

        function updateSpeechRate(val) {
            state.speechRate = val;
            document.getElementById('rateVal').textContent = `${val}x`;
        }

        document.getElementById('zhVoiceSelect').addEventListener('change', (e) => {
            state.selectedZhVoice = e.target.value;
        });

        document.getElementById('jaVoiceSelect').addEventListener('change', (e) => {
            state.selectedJaVoice = e.target.value;
        });

        document.getElementById('autoReadJa').addEventListener('change', (e) => {
            state.autoReadJa = e.target.checked;
        });

        function showToast(msg, type = "info") {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');

            toastMsg.textContent = msg;

            if (type === "success") {
                toastIcon.className = "fa-solid fa-circle-check text-emerald-500 text-base";
            } else if (type === "warning") {
                toastIcon.className = "fa-solid fa-triangle-exclamation text-amber-500 text-base";
            } else if (type === "error") {
                toastIcon.className = "fa-solid fa-circle-xmark text-rose-500 text-base";
            } else {
                toastIcon.className = "fa-solid fa-circle-info text-teal-500 text-base";
            }

            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }
    </script>
